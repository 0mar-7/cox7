<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODE ONE X7 - محرر ومستضيف المواقع</title>
    
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ff003c;
            --bg-dark: #070709;
            --card-bg: rgba(18, 18, 24, 0.9);
            --border-color: #262630;
            --text-main: #f1f1f5;
            --text-muted: #8e8e9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 0, 60, 0.15), transparent 50%);
        }

        nav {
            background: rgba(15, 15, 20, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-box {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: #121218;
            border: 2px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.4);
        }

        .logo-box svg {
            width: 24px;
            height: 24px;
            fill: var(--primary);
        }

        .brand-title {
            font-weight: 900;
            font-size: 22px;
        }
        .brand-title span { color: var(--primary); }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--primary);
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        label {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-main);
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 14px;
            background-color: rgba(10, 10, 14, 0.8);
            border: 1px solid var(--border-color);
            color: #ffffff;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--primary);
        }

        textarea { height: 220px; resize: vertical; font-family: monospace; }

        .image-upload-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .image-preview {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            border: 2px dashed var(--primary);
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .image-preview span {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
        }

        .file-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
        }

        input[type="file"] { display: none; }

        .main-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), #a00026);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
        }

        .main-btn:hover {
            transform: translateY(-2px);
        }

        .result-box {
            background: #111116;
            border: 2px solid var(--primary);
            padding: 24px;
            border-radius: 12px;
            display: none;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        .link-display {
            background: #07070a;
            padding: 14px;
            border-radius: 8px;
            color: #00ff88;
            font-family: monospace;
            direction: ltr;
            text-align: center;
            border: 1px dashed var(--primary);
            word-break: break-all;
        }

        footer {
            background: rgba(10, 10, 14, 0.8);
            border-top: 1px solid var(--border-color);
            padding: 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 60px;
        }
        footer span { color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

    <nav>
        <div class="brand">
            <div class="logo-box">
                <svg viewBox="0 0 24 24">
                    <path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/>
                </svg>
            </div>
            <div class="brand-title">CODE <span>ONE</span> X7</div>
        </div>

        <div id="authContainer">
            <button class="file-btn" style="border-color: var(--primary);" onclick="mockGoogleLogin()">تسجيل تجريبي سريع</button>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="form-grid">
                <div class="form-group">
                    <label>الاسم المخصص لصفحتك (Slug):</label>
                    <input type="text" id="customSlug" placeholder="my-website">
                </div>
                <div class="form-group">
                    <label>عنوان الموقع (Title):</label>
                    <input type="text" id="siteTitle" placeholder="موقعي الشخصي">
                </div>
            </div>

            <div class="form-group">
                <label>شعار الموقع (قص 1x1 تلقائي):</label>
                <div class="image-upload-wrapper">
                    <div class="image-preview">
                        <span id="previewText">1x1</span>
                        <img id="iconPreview" alt="Preview">
                    </div>
                    <div>
                        <button type="button" class="file-btn" onclick="document.getElementById('iconFile').click()">رفع صورة من الجهاز</button>
                        <input type="file" id="iconFile" accept="image/*" onchange="processImage(this)">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>الكود البرمجي (HTML / CSS / JS):</label>
                <textarea id="codeEditor" placeholder="<h1>مرحباً بك في موقعي!</h1>"></textarea>
            </div>

            <button class="main-btn" onclick="generateAndPreview()">توليد ورؤية الصفحة فوراً</button>

            <div class="result-box" id="resultBox">
                <h3 style="color:#00ff88; text-align:center;">تم تجهيز موقعك بنجاح!</h3>
                <div class="link-display" id="finalUrl"></div>
                <button class="main-btn" style="background:#1b1b22; border:1px solid var(--primary);" onclick="openLivePage()">معاينة الموقع الآن في نافذة جديدة</button>
            </div>
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة &copy; <span>2026</span> - <strong>CODE <span>ONE</span> X7</strong>
    </footer>

    <script>
        let base64Icon = "";
        let generatedBlobUrl = "";

        function mockGoogleLogin() {
            document.getElementById('authContainer').innerHTML = `
                <div class="user-profile">
                    <img src="https://via.placeholder.com/32/ff003c/ffffff?text=U" class="avatar" alt="User">
                    <span>مستخدم متصل</span>
                </div>
            `;
        }

        function processImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const size = 200;
                        canvas.width = size;
                        canvas.height = size;

                        const minDim = Math.min(img.width, img.height);
                        const sx = (img.width - minDim) / 2;
                        const sy = (img.height - minDim) / 2;

                        ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, size, size);
                        base64Icon = canvas.toDataURL('image/png');
                        
                        const previewImg = document.getElementById('iconPreview');
                        previewImg.src = base64Icon;
                        previewImg.style.display = 'block';
                        document.getElementById('previewText').style.display = 'none';
                    };
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function generateAndPreview() {
            const slug = document.getElementById('customSlug').value.trim() || 'my-site';
            const title = document.getElementById('siteTitle').value.trim() || 'موقعي';
            const code = document.getElementById('codeEditor').value.trim();

            if (!code) {
                alert("يرجى كتابة أيو كود HTML أولاً!");
                return;
            }

            const fullPage = `
                <!DOCTYPE html>
                <html lang="ar">
                <head>
                    <meta charset="UTF-8">
                    <title>${title}</title>
                    ${base64Icon ? `<link rel="icon" href="${base64Icon}">` : ''}
                </head>
                <body>
                    ${code}
                </body>
                </html>
            `;

            // إنشاء رابط Blob يعمل داخل المتصفح فوراً بدون الحاجة لسيرفر خارجي معطل
            const blob = new Blob([fullPage], { type: 'text/html;charset=utf-8' });
            generatedBlobUrl = URL.createObjectURL(blob);

            document.getElementById('finalUrl').innerText = `https://codeonex7.com/${slug}`;
            document.getElementById('resultBox').style.display = 'flex';
        }

        function openLivePage() {
            if (generatedBlobUrl) {
                window.open(generatedBlobUrl, '_blank');
            }
        }
    </script>
</body>
</html>
